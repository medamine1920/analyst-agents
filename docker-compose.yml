services:
  mcp:
    build: .
    image: analyst-agents-mcp
    container_name: analyst-agents-mcp
    restart: unless-stopped
    ports:
      # Reachable only from the server itself (and through an SSH tunnel).
      - "127.0.0.1:8100:8000"

  # The Analyst Console (API + web app), from the same image with another start command.
  console:
    build: .
    image: analyst-agents-mcp
    container_name: analyst-agents-console
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Read from the .env file next to this compose file on the server (never committed, never in
      # the image). Without a key the console still starts; live questions explain what is missing.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Limits on the shared model budget (see app/api/security.py); a user's own model key skips them.
      DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-150000}
      USER_DAILY_TOKENS: ${USER_DAILY_TOKENS:-25000}
      # The console starts its own MCP server as a child process, over stdio.
      MCP_TRANSPORT: stdio
      # Live runs and paused questions are kept in the volume, so history survives a redeploy.
      LIVE_TRACES_DIR: /srv/checkpoints/traces
      # Users' data sources (uploaded files, generated metrics) live in the volume too.
      SOURCES_DIR: /srv/checkpoints/sources
      # Optional: a passphrase for encrypting database passwords. Without it a key file is created in
      # the volume on first use.
      SOURCES_SECRET: ${SOURCES_SECRET:-}
      # Optional: a passphrase for the console's other secrets (connector tokens, two-step sign-in keys);
      # without it a key file is created in the volume.
      CONSOLE_SECRET: ${CONSOLE_SECRET:-}
      CONSOLE_KEY_FILE: /srv/checkpoints/.console_key
      # Google Sheets & Drive connector (see docs/connectors.md); without these the card stays inactive.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional, for Google's file picker (users choose files; the app can then be published for everyone).
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_APP_ID: ${GOOGLE_APP_ID:-}
      CONSOLE_URL: ${CONSOLE_URL:-https://analyst.medamine.work}
    volumes:
      - console-checkpoints:/srv/checkpoints
    networks:
      # "web" is the server's reverse-proxy network: Caddy reaches this service there by its
      # container name (analyst-agents-console:8000). Without it the public address returns an error.
      - default
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    ports:
      # Same rule as above: local only. Anyone who can reach it can spend the Groq quota.
      - "127.0.0.1:8200:8000"

volumes:
  console-checkpoints:

networks:
  web:
    external: true
