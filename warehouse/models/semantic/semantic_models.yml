semantic_models:
  - name: orders
    description: One row per order.
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: order_id
        type: primary
      - name: customer
        type: foreign
        expr: customer_id
      - name: store
        type: foreign
        expr: store_id
    dimensions:
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: is_first_order
        type: categorical
    measures:
      - name: order_count
        agg: sum
        expr: 1
      - name: subtotal
        agg: sum
      - name: order_total
        agg: sum
      - name: tax_paid
        agg: sum
      - name: new_customers
        agg: sum
        expr: case when is_first_order then 1 else 0 end
      - name: ordering_customers
        agg: count_distinct
        expr: customer_id

  - name: order_items
    description: One row per item sold.
    model: ref('fct_order_items')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order_id
        type: foreign
      - name: product
        type: foreign
        expr: product_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: store
        type: foreign
        expr: store_id
    dimensions:
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: items_sold
        agg: sum
        expr: 1
      - name: item_revenue
        agg: sum
        expr: product_price

  - name: customers
    description: One row per customer.
    model: ref('dim_customers')
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions:
      - name: customer_name
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day

  - name: stores
    description: One row per store, including stores with no orders.
    model: ref('dim_stores')
    defaults:
      agg_time_dimension: opened_at
    entities:
      - name: store
        type: primary
        expr: store_id
    dimensions:
      - name: store_name
        type: categorical
      - name: opened_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: store_count
        agg: count_distinct
        expr: store_id

  - name: products
    description: One row per product.
    model: ref('dim_products')
    entities:
      - name: product
        type: primary
        expr: product_id
    dimensions:
      - name: product_name
        type: categorical
      - name: product_type
        type: categorical
